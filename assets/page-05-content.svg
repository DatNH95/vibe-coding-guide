<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="page-05-content" font-family="Arial, Helvetica, sans-serif">
    <rect x="940" y="100" width="880" height="879" fill="#0076BE"/>
    <g id="page-05-system">
      <text x="100" y="220" font-size="56" fill="#0076BE">Vẽ Figma hay là giao tiếp?</text>
      <text x="100" y="330" font-size="30" fill="#263C53">
        <tspan x="100">Workflow không thay đổi,</tspan>
        <tspan x="100" dy="46">chỉ có tốc độ nhanh hơn.</tspan>
        <tspan x="100" dy="46">Vẫn là vẽ nhưng vẽ bằng sự giao tiếp.</tspan>

      </text>
      <rect x="100" y="490" width="780" height="250" rx="12" fill="#F3F7FC"/>
      <rect x="100" y="502" width="4" height="226" rx="2" fill="#0076BE"/>
      <text x="132" y="542" font-size="28" fill="#0076BE">Quy trình chung</text>
      <text x="132" y="586" font-size="26" fill="#263C53">
        <tspan x="132">Khởi tạo Design System như cách chúng ta bắt đầu</tspan>
        <tspan x="132" dy="36">vẽ với Figma, điều này giúp Codex hiểu style</tspan>
        <tspan x="132" dy="36">mong muốn, mã màu, font chữ, quy tắc và</tspan>
        <tspan x="132" dy="36">văn phong của VnExpress.</tspan>
      </text>
      <rect x="100" y="790" width="780" height="116" rx="12" fill="#F3F7FC"/>
      <text x="130" y="839" font-size="30" fill="#0076BE">
        <tspan x="130">Khai báo một lần,</tspan>
        <tspan x="130" dy="42">dùng chung cho toàn bộ dự án.</tspan>
      </text>
    </g>
    <g id="page-05-tip" fill="white">
      <text x="1020" y="220" font-size="64" font-weight="400">Tip</text>
      <text x="1020" y="330" font-size="30">
        <tspan x="1020">Header và Footer dùng chung template VnE.</tspan>
        <tspan x="1020" dy="46">Vào Figma, xuất file SVG và đặt tên</tspan>
        <tspan x="1020" dy="46">tương ứng:</tspan>
      </text>
      <text x="1020" y="518" font-size="32">
        <tspan x="1020">header/pc · header/mobile</tspan>
        <tspan x="1020" dy="52">footer/pc · footer/mobile</tspan>
      </text>
      <text x="1020" y="676" font-size="30">
        <tspan x="1020">Copy vào folder publish/asset/template</tspan>
        <tspan x="1020" dy="76">Để Codex đọc file thiết kế và dựng lại</tspan>
        <tspan x="1020" dy="46">cấu trúc SVG thành HTML.</tspan>
      </text>
    </g>
  </g>
</svg>
