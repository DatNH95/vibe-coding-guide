<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="page-02-content" font-family="Arial, Helvetica, sans-serif">
    <g id="page-02-intro">
      <text x="100" y="230" fill="#0076BE" font-size="64">Vibe coding</text>
      <text x="100" y="308" fill="#263C53" font-size="64">là gì?</text>
      <text x="100" y="414" fill="#263C53" font-size="32">Từ ý tưởng đến sản phẩm</text>
      <text x="100" y="478" fill="#6B6B6B" font-size="30">
        <tspan x="100">Diễn đạt ý tưởng bằng ngôn ngữ tự nhiên,</tspan>
        <tspan x="100" dy="46">để AI tạo code; xem kết quả và trao đổi</tspan>
        <tspan x="100" dy="46">từng bước để hoàn thiện sản phẩm.</tspan>
      </text>
      <text x="100" y="635" fill="#263C53" font-size="28">
        <tspan x="100">Ta là người quan sát, định hướng và đưa ra câu lệnh,</tspan>
        <tspan x="100" dy="44">việc còn lại là của ...</tspan>
      </text>
      <text x="100" y="805" fill="#0076BE" font-size="32">Claude · Codex · AI Studio</text>
    </g>
    <line x1="940" y1="180" x2="940" y2="917" stroke="#E5E9ED"/>
    <rect x="940" y="100" width="880" height="879" fill="#0076BE"/>
    <g id="page-02-slogan" fill="white" font-family="Arial, Helvetica, sans-serif">
      <text x="1020" y="405" font-size="112" font-weight="700" letter-spacing="-2">Không hiểu</text>
      <text x="1020" y="525" font-size="58" font-weight="400">thì không thể</text>
      <text x="1020" y="705" font-size="148" font-weight="700" letter-spacing="-3">làm tốt</text>
    </g>
  </g>
</svg>
