<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><g font-family="Arial, Helvetica, sans-serif"><defs><radialGradient id="page-09-aura"><stop stop-color="#29BCE0" stop-opacity=".3"/><stop offset=".5" stop-color="#0076BE" stop-opacity=".12"/><stop offset="1" stop-color="#0076BE" stop-opacity="0"/></radialGradient></defs><g pointer-events="none"><g transform="translate(1380 540)"><ellipse class="page-07-aura" rx="500" ry="400" fill="url(#page-09-aura)"/><ellipse class="page-07-aura page-07-aura-late" rx="500" ry="400" fill="url(#page-09-aura)"/></g></g><g id="page-09-workflow"><text x="100" y="220" font-size="56" fill="#0076BE">GitHub → Vercel</text><text x="100" y="300" font-size="30" fill="#263C53">Đẩy code và kiểm tra chéo</text><g fill="#0076BE"><circle cx="130" cy="420" r="30"/><circle cx="130" cy="560" r="30"/><circle cx="130" cy="700" r="30"/></g><g fill="white" text-anchor="middle" font-size="22"><text x="130" y="428">01</text><text x="130" y="568">02</text><text x="130" y="708">03</text></g><g fill="#263C53" font-size="28"><text x="190" y="414"><tspan x="190">Đẩy code lên GitHub</tspan><tspan x="190" dy="42">với folder hand-off.html</tspan></text><text x="190" y="569">Kết nối Vercel để check chéo</text><text x="190" y="694"><tspan x="190">Tạo cửa sổ chat mới</tspan><tspan x="190" dy="42">trong folder dự án đang code</tspan></text></g><rect x="100" y="824" width="780" height="90" rx="12" fill="#F3F7FC"/><text x="132" y="880" font-size="26" fill="#0076BE">Dùng câu lệnh bên phải để thiết lập rule.</text></g><g id="page-09-prompt" fill="#263C53"><rect x="990" y="225" width="800" height="700" rx="12" fill="#F3F7FC"/><rect x="990" y="237" width="4" height="676" rx="2" fill="#0076BE"/><text x="1020" y="195" font-size="40" fill="#0076BE">Câu lệnh đẩy code</text><text x="1020" y="270" font-size="25"><tspan x="1020">Tạo file AGENTS.md tại thư mục gốc project</tspan><tspan x="1020" dy="38">và thiết lập rule:</tspan><tspan x="1020" dy="60">Khi tôi nói “Đẩy lên GitHub”:</tspan><tspan x="1020" dy="52">1. Kiểm tra Git status và thay đổi hiện tại.</tspan><tspan x="1020" dy="52">2. Chỉ commit file thuộc project, bỏ qua</tspan><tspan x="1020" dy="36">file tạm và dữ liệu nhạy cảm.</tspan><tspan x="1020" dy="52">3. Chạy kiểm tra phù hợp nếu có.</tspan><tspan x="1020" dy="52">4. Tạo commit message ngắn,</tspan><tspan x="1020" dy="36">mô tả đúng thay đổi.</tspan><tspan x="1020" dy="52">5. Push lên origin/main.</tspan><tspan x="1020" dy="52">6. Báo commit hash và trạng thái push.</tspan><tspan x="1020" dy="60">Nếu có conflict, lỗi hoặc remote có commit mới</tspan><tspan x="1020" dy="36">chưa đồng bộ, dừng và báo tôi. Không force push.</tspan><tspan x="1020" dy="60">Không thay đổi code hiện tại.</tspan></text></g></g></svg>
