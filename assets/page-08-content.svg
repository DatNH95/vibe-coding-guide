<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><g font-family="Arial, Helvetica, sans-serif"><rect x="940" y="100" width="880" height="879" fill="#0076BE"/><g id="page-08-structure" transform="translate(-12 0)"><text x="100" y="220" font-size="56" fill="#0076BE">Hand-off Tech</text><text x="100" y="294" font-size="32" fill="#263C53">Cấu trúc section</text><rect x="100" y="310" width="780" height="165" rx="12" fill="#F3F7FC"/><text x="132" y="345" font-size="22" font-family="Consolas, monospace" fill="#263C53" xml:space="preserve"><tspan x="132">&lt;HEAD&gt;</tspan><tspan x="132" dy="26">&lt;BODY&gt;</tspan><tspan x="132" dy="26"> &lt;div class ="tên frame hiển thị"&gt;</tspan><tspan x="132" dy="26">  &lt;section class ="tên vùng hiển thị"&gt;</tspan><tspan x="132" dy="26">  &lt;/section&gt;</tspan></text><text x="100" y="511" font-size="24" fill="#263C53"><tspan x="100">Section là 1 vùng, 1 phần của 1 khu vực chính.</tspan><tspan x="100" dy="28">Trong section có chứa class (class là quy ước</tspan><tspan x="100" dy="28">đặt tên cho vùng hiển thị đó).</tspan></text><g id="page-08-figma"><line x1="100" y1="624" x2="880" y2="624" stroke="#DDE5ED"/><text x="100" y="664" font-size="24" font-weight="700" fill="#263C53">VD với quy ước đặt tên frame trên Figma dễ hình dung</text><rect x="100" y="684" width="780" height="249" rx="12" fill="#F3F7FC"/><text x="122" y="712" font-size="18" fill="#0076BE">FRAME</text><path d="M138 722v164m0-150h20m-20 68h20m-20 82h20M174 738v33h18M174 812v57h18M174 893v20h18" fill="none" stroke="#0076BE" stroke-opacity=".4" stroke-width="2"/><g font-size="21" fill="#263C53"><text x="170" y="736">HEAD (chứa section cụm header, menu, kv)</text><text x="206" y="759" fill="#0076BE">section / menu</text><text x="206" y="782" fill="#0076BE">section / hero-banner</text><text x="170" y="807">BODY (chứa section cụm thông tin chính)</text><text x="206" y="830" fill="#0076BE">section / about</text><text x="206" y="853" fill="#0076BE">section / agenda</text><text x="206" y="876" fill="#0076BE">section / news</text><text x="170" y="900">FOOTER (chứa section thông tin liên hệ)</text><text x="206" y="922" fill="#0076BE">section / contact</text></g></g></g><g id="page-08-handoff" fill="white" transform="translate(12 0)"><text x="1020" y="220" font-size="44">Cách bàn giao</text><g transform="translate(1050 305)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">01</text></g><text x="1088" y="315" font-size="30">Chưa code</text><text x="1020" y="369" font-size="26"><tspan x="1020">Sử dụng bộ HTML/CSS .zip từ Tech để Codex</tspan><tspan x="1020" dy="38">đọc hiểu và viết lại cấu trúc y hệt ngay từ khi</tspan><tspan x="1020" dy="38">bắt đầu triển khai dự án</tspan></text><g transform="translate(1050 555)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">02</text></g><text x="1088" y="565" font-size="30">Đang code</text><text x="1020" y="619" font-size="24"><tspan x="1020">Yêu cầu Codex sửa lại cấu trúc HTML/CSS theo</tspan><tspan x="1020" dy="34">section, quy ước đặt tên mà Tech yêu cầu.</tspan><tspan x="1020" dy="34">Cách này sẽ tốn token và dễ sinh code rác,</tspan><tspan x="1020" dy="34">cần xử lý bằng model cao cấp.</tspan><tspan x="1020" dy="48">DEV dựa vào bản Vercel (bản vẽ chính thức)</tspan><tspan x="1020" dy="34">để compare với source HTML AI gen theo</tspan><tspan x="1020" dy="34">cấu trúc mới. Vẫn cần người thật làm việc này</tspan><tspan x="1020" dy="34">để đảm bảo đúng order từ Product.</tspan></text></g></g></svg>
