<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><g font-family="Arial, Helvetica, sans-serif"><rect x="940" y="100" width="880" height="879" fill="#0076BE"/><g id="page-08-structure"><text x="100" y="220" font-size="56" fill="#0076BE">Hand-off Tech</text><text x="100" y="310" font-size="32" fill="#263C53">Cấu trúc section</text><rect x="100" y="370" width="780" height="210" rx="12" fill="#F3F7FC"/><text x="132" y="433" font-size="24" font-family="Consolas, monospace" fill="#263C53"><tspan x="132">&lt;section class="section thành-phần ..."&gt;</tspan><tspan x="132" dy="48">  Nội dung thành phần</tspan><tspan x="132" dy="48">&lt;/section&gt;</tspan></text><text x="100" y="664" font-size="28" fill="#263C53"><tspan x="100">section chứa thành phần chính.</tspan><tspan x="100" dy="48">class gồm section, thành phần và tên dự án.</tspan></text><g id="page-08-figma"><text x="100" y="779" font-size="25" fill="#263C53">VD với quy ước đặt tên frame trên Figma dễ hình dung</text><rect x="100" y="805" width="780" height="151" rx="12" fill="#F3F7FC"/><text x="124" y="834" font-size="21" fill="#0076BE">FRAME</text><path d="M140 846v85m0-72h22m-22 25h22m-22 47h22M182 887v20h20" fill="none" stroke="#0076BE" stroke-opacity=".4" stroke-width="2"/><g font-size="18" fill="#263C53"><text x="175" y="859">HEAD (chứa section cụm header, menu)</text><text x="175" y="884">BODY (chứa section các cụm thông tin, about, agenda, tin tức)</text><text x="216" y="907" fill="#0076BE">section / about</text><text x="175" y="932">FOOTER (chứa section cụm thông tin)</text></g></g></g><g id="page-08-handoff" fill="white"><text x="1020" y="220" font-size="44">Cách bàn giao</text><g transform="translate(1050 305)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">01</text></g><text x="1088" y="315" font-size="30">Chưa code</text><text x="1020" y="369" font-size="26"><tspan x="1020">Sử dụng bộ HTML/CSS .zip từ Tech để Codex</tspan><tspan x="1020" dy="38">đọc hiểu và viết lại cấu trúc y hệt ngay từ khi</tspan><tspan x="1020" dy="38">bắt đầu triển khai dự án</tspan></text><g transform="translate(1050 555)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">02</text></g><text x="1088" y="565" font-size="30">Đang code</text><text x="1020" y="619" font-size="24"><tspan x="1020">Yêu cầu Codex sửa lại cấu trúc HTML/CSS theo</tspan><tspan x="1020" dy="34">section, quy ước đặt tên mà Tech yêu cầu.</tspan><tspan x="1020" dy="34">Cách này sẽ tốn token và dễ sinh code rác,</tspan><tspan x="1020" dy="34">cần xử lý bằng model cao cấp.</tspan><tspan x="1020" dy="48">DEV dựa vào bản Vercel (bản vẽ chính thức)</tspan><tspan x="1020" dy="34">để compare với source HTML AI gen theo</tspan><tspan x="1020" dy="34">cấu trúc mới. Vẫn cần người thật làm việc này</tspan><tspan x="1020" dy="34">để đảm bảo đúng order từ Product.</tspan></text></g></g></svg>
