<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><g font-family="Arial, Helvetica, sans-serif"><rect x="940" y="100" width="880" height="879" fill="#0076BE"/><g id="page-08-structure"><text x="100" y="220" font-size="56" fill="#0076BE">Hand-off Tech</text><text x="100" y="310" font-size="32" fill="#263C53">Cấu trúc section</text><rect x="100" y="370" width="780" height="210" rx="12" fill="#F3F7FC"/><text x="132" y="433" font-size="24" font-family="Consolas, monospace" fill="#263C53"><tspan x="132">&lt;section class="section thành-phần ..."&gt;</tspan><tspan x="132" dy="48">  Nội dung thành phần</tspan><tspan x="132" dy="48">&lt;/section&gt;</tspan></text><text x="100" y="664" font-size="28" fill="#263C53"><tspan x="100">section chứa thành phần chính.</tspan><tspan x="100" dy="48">class gồm section, thành phần và tên dự án.</tspan></text><g id="page-08-figma"><text x="100" y="790" font-size="26" fill="#263C53">Tương tự cấu trúc xử lý trên Figma</text><rect x="100" y="819" width="780" height="122" rx="12" fill="#F3F7FC"/><text x="132" y="854" font-size="22" fill="#0076BE">FRAME</text><path d="M150 866v42m0-21h30m-30 21h30M150 866h30" fill="none" stroke="#0076BE" stroke-opacity=".4" stroke-width="2"/><text x="194" y="873" font-size="20" fill="#263C53">HEAD</text><text x="194" y="894" font-size="20" fill="#263C53">BODY</text><text x="194" y="915" font-size="20" fill="#263C53">FOOTER</text></g></g><g id="page-08-handoff" fill="white"><text x="1020" y="220" font-size="44">Cách bàn giao</text><g transform="translate(1050 305)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">01</text></g><text x="1088" y="315" font-size="30">Chưa code</text><text x="1020" y="369" font-size="26"><tspan x="1020">Sử dụng bộ HTML/CSS .zip từ Tech để Codex</tspan><tspan x="1020" dy="38">đọc hiểu và viết lại cấu trúc y hệt ngay từ khi</tspan><tspan x="1020" dy="38">bắt đầu triển khai dự án</tspan></text><g transform="translate(1050 555)"><circle r="20" fill="white"/><text y="6" text-anchor="middle" font-size="16" fill="#0076BE">02</text></g><text x="1088" y="565" font-size="30">Đang code</text><text x="1020" y="619" font-size="26"><tspan x="1020">Yêu cầu Codex viết lại cấu trúc bằng HTML</tspan><tspan x="1020" dy="38">dạng table và inline CSS.</tspan><tspan x="1020" dy="38">Cách này tốn token và dễ sinh code rác.</tspan><tspan x="1020" dy="54">Bắt buộc kiểm tra, rà soát và sửa lỗi phát sinh.</tspan><tspan x="1020" dy="38">Gửi DEV kiểm tra đúng yêu cầu trước khi</tspan><tspan x="1020" dy="38">bàn giao.</tspan></text></g></g></svg>
