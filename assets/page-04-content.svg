<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="page-04-content" font-family="Arial, Helvetica, sans-serif">
    <rect x="940" y="100" width="880" height="879" fill="#0076BE"/>
    <g id="page-04-guideline">
      <text x="100" y="220" font-size="56" fill="#0076BE">Để Codex không đi “lạc”</text>
      <text x="100" y="302" font-size="28" fill="#263C53">
        <tspan x="100">Sử dụng câu lệnh tham khảo</tspan>
        <tspan x="100" dy="42">để bắt đầu dự án</tspan>
      </text>
      <rect x="100" y="390" width="780" height="430" rx="12" fill="#F3F7FC"/>
      <rect x="100" y="402" width="4" height="406" rx="2" fill="#0076BE"/>
      <text x="132" y="438" font-size="25" fill="#263C53">
        <tspan x="132">Bạn là 1 chuyên gia Product Designer</tspan>
        <tspan x="132" dy="42">chuyên nghiệp, hãy sử dụng suy luận và</tspan>
        <tspan x="132" dy="42">kiến thức của mình có được để xây dựng</tspan>
        <tspan x="132" dy="42">1 sản phẩm dạng landing page bình chọn</tspan>
        <tspan x="132" dy="42">dựa trên từng yêu cầu mà tôi đưa ra để</tspan>
        <tspan x="132" dy="42">từ đó tối ưu và xây dựng prompt</tspan>
        <tspan x="132" dy="42">cho từng phase của dự án.</tspan>
        <tspan x="132" dy="42">Quy ước prompt sẽ là 001 - Tương ứng</tspan>
        <tspan x="132" dy="42">với phase 1.</tspan>
      </text>
      <text x="100" y="866" font-size="26" fill="#0076BE">
        <tspan x="100">— Dán link google sheet (file yêu cầu từ event)</tspan>
        <tspan x="100" dy="48">— Dán link key-visual (nếu có) + tự thiết kế</tspan>
      </text>
    </g>
    <g id="page-04-tip" fill="white">
      <text x="1020" y="230" font-size="64" font-weight="400">Tip nhỏ</text>
      <text x="1020" y="340" font-size="30">
        <tspan x="1020">Mỗi 1 dự án chúng ta cần tạo 1 đoạn</tspan>
        <tspan x="1020" dy="46">chát mới thuộc folder của dự án đó</tspan>
      </text>
      <text x="1020" y="463" font-size="44" font-weight="400">Trợ lý [Tên dự án]</text>
      <text x="1020" y="572" font-size="30">
        <tspan x="1020">Trợ lý kết nối với Codex Work,</tspan>
        <tspan x="1020" dy="46">hỗ trợ viết prompt và giải đáp</tspan>
        <tspan x="1020" dy="46">những vấn đề bạn chưa rõ.</tspan>
        <tspan x="1020" dy="76">Chỉ xử lý yêu cầu và câu hỏi</tspan>
        <tspan x="1020" dy="46">trong phạm vi dự án.</tspan>
      </text>
    </g>
  </g>
</svg>
