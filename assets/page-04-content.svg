<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="page-04-content" font-family="Arial, Helvetica, sans-serif">
    <rect x="940" y="100" width="880" height="879" fill="#0076BE"/>
    <g id="page-04-guideline">
      <text x="100" y="220" font-size="56" fill="#0076BE">Để Codex không đi “lạc”</text>
      <text x="100" y="302" font-size="32" fill="#263C53">Vì sao cần file AGENTS.md?</text>
      <rect x="100" y="360" width="780" height="475" rx="12" fill="#F3F7FC"/>
      <rect x="100" y="372" width="4" height="451" rx="2" fill="#0076BE"/>
      <text x="132" y="410" font-size="28" fill="#263C53">
        <tspan x="132">AGENTS.md là file hướng dẫn làm việc</tspan>
        <tspan x="132" dy="40">mà Codex đọc trước khi bắt đầu.</tspan>
      </text>
      <text x="132" y="510" font-size="28" fill="#0076BE">01 — Thống nhất quy tắc</text>
      <text x="132" y="552" font-size="26" fill="#263C53">Cấu trúc, cách viết code và quy ước của dự án.</text>
      <text x="132" y="620" font-size="28" fill="#0076BE">02 — Giữ đúng phạm vi</text>
      <text x="132" y="662" font-size="26" fill="#263C53">Nêu rõ việc cần làm và giới hạn cần tuân thủ.</text>
      <text x="132" y="730" font-size="28" fill="#0076BE">03 — Làm việc nhất quán</text>
      <text x="132" y="772" font-size="26" fill="#263C53">Dùng chung hướng dẫn, giảm việc nhắc lại.</text>
      <text x="100" y="888" font-size="26" fill="#263C53">
        <tspan x="100">Đặt file tại thư mục gốc của dự án.</tspan>
        <tspan x="100" dy="40">Viết rõ, ngắn gọn và cập nhật khi quy tắc thay đổi.</tspan>
      </text>
    </g>
    <g id="page-04-tip" fill="white">
      <text x="1020" y="230" font-size="46" font-weight="400">
        <tspan x="1020">Từ quan sát thành người</tspan>
        <tspan x="1020" dy="62">kiểm duyệt và định hướng.</tspan>
      </text>
      <text x="1020" y="410" font-size="30">Tạo 1 trợ lý có tên</text>
      <text x="1020" y="479" font-size="44" font-weight="400">Trợ lý [Tên dự án]</text>
      <text x="1020" y="588" font-size="30">
        <tspan x="1020">Ta quan sát, định hướng và giao tiếp</tspan>
        <tspan x="1020" dy="46">còn lại để trợ lý lo...</tspan>
      </text>
    </g>
  </g>
</svg>
